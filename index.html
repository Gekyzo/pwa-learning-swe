<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>Learning SWE</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./vendor/design-system/design-system.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-action" class="button strong" type="button" hidden></button>
    </div>

    <main>
      <section id="feed" class="feed">
        <div class="feed-layout">
          <div class="feed-main">
            <ol id="feed-list" class="feed-list"></ol>
            <div id="feed-more" class="feed-more"></div>
            <div id="feed-end" class="empty-state" hidden>
              <p class="empty-state-title" data-i18n="feed.endTitle"></p>
              <p id="feed-end-text"></p>
              <button id="feed-again" class="button primary" type="button" data-i18n="feed.again"></button>
            </div>
            <div id="feed-error" class="empty-state" hidden>
              <p data-i18n="feed.error"></p>
              <button id="feed-retry" class="button primary" type="button" data-i18n="feed.retry"></button>
            </div>
          </div>
          <aside id="feed-side" class="feed-side-col">
            <div id="feed-panels" class="feed-panels" hidden>
              <section id="panel-today" class="feed-panel">
                <h2 class="feed-panel-head"><span id="today-title" data-i18n="side.today"></span><span id="today-count" class="feed-panel-aside"></span></h2>
                <div id="today-progress" class="progress data" role="progressbar" aria-valuemin="0" aria-labelledby="today-title today-count"></div>
                <p id="today-note" class="feed-panel-note"></p>
              </section>
              <section id="panel-bars" class="feed-panel">
                <h2 class="feed-panel-head"><span data-i18n="side.bars"></span><span class="feed-panel-aside" data-i18n="side.barsNote"></span></h2>
                <ol id="due-bars" class="due-bars"></ol>
              </section>
              <section id="panel-states" class="feed-panel">
                <h2 id="states-title" class="feed-panel-head"></h2>
                <dl class="feed-panel-lines">
                  <div class="feed-panel-line"><dt data-i18n="side.learning"></dt><dd id="state-learning" class="feed-panel-value"></dd></div>
                  <div class="feed-panel-line"><dt data-i18n="side.known"></dt><dd id="state-known" class="feed-panel-value"></dd></div>
                  <div class="feed-panel-line"><dt data-i18n="side.mastered"></dt><dd id="state-mastered" class="feed-panel-value"></dd></div>
                </dl>
              </section>
              <section id="panel-topics" class="feed-panel">
                <h2 class="feed-panel-head"><span data-i18n="side.topics"></span></h2>
                <p class="topic-ledger-head"><span></span><span data-i18n="side.seen"></span><span data-i18n="side.due"></span><span data-i18n="side.fresh"></span></p>
                <ol id="topic-ledger" class="topic-ledger"></ol>
              </section>
            </div>
          </aside>
        </div>
      </section>

      <section id="saved" class="feed" hidden>
        <ol id="saved-list" class="feed-list"></ol>
        <div id="saved-empty" class="empty-state" hidden>
          <p data-i18n="saved.empty"></p>
          <button id="saved-feed" class="button primary" type="button" data-i18n="saved.feed"></button>
        </div>
      </section>

      <section id="settings" class="settings" hidden>
        <section class="settings-group">
          <div class="settings-label">
            <h2 class="list-group-head" data-i18n="settings.topics"></h2>
            <p id="topics-note" class="settings-note"></p>
          </div>
          <div class="settings-rows">
            <div id="topics" class="list-group"></div>
          </div>
        </section>
        <section class="settings-group">
          <div class="settings-label">
            <h2 class="list-group-head" data-i18n="settings.preferences"></h2>
            <p class="settings-note" data-i18n="settings.preferencesNote"></p>
          </div>
          <div class="settings-rows">
            <div class="list-group">
              <div class="settings-row">
                <span class="settings-row-label" data-i18n="settings.language"></span>
                <span id="language-value" class="settings-row-value"></span>
                <span class="chevron" aria-hidden="true">›</span>
                <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
              </div>
              <div class="settings-row">
                <span class="settings-row-label" data-i18n="settings.hand"></span>
                <span id="hand-value" class="settings-row-value"></span>
                <span class="chevron" aria-hidden="true">›</span>
                <select id="hand" class="select" data-i18n-attr="aria-label:settings.hand"></select>
              </div>
              <div class="settings-row">
                <span class="settings-row-label" data-i18n="settings.theme"></span>
                <span id="theme-value" class="settings-row-value"></span>
                <span class="chevron" aria-hidden="true">›</span>
                <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
              </div>
              <label class="switch"><span data-i18n="settings.savedInNav"></span><input class="switch-input" type="checkbox" role="switch" data-module="saved"></label>
            </div>
          </div>
        </section>
        <section class="settings-group">
          <div class="settings-label">
            <h2 class="list-group-head" data-i18n="settings.accountBackup"></h2>
          </div>
          <div class="settings-rows">
            <div id="account-group" class="list-group" hidden>
              <div id="account-row" class="settings-row"><span id="account-email" class="settings-row-label"></span></div>
              <button id="logout" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.logout"></span><span class="chevron" aria-hidden="true">›</span></button>
              <button id="account-login" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.signIn"></span><span class="chevron" aria-hidden="true">›</span></button>
            </div>
            <div class="list-group">
              <button id="export" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.export"></span><span class="chevron" aria-hidden="true">›</span></button>
              <button id="import" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.import"></span><span class="chevron" aria-hidden="true">›</span></button>
            </div>
          </div>
        </section>
        <section class="settings-group">
          <div class="settings-label">
            <h2 class="list-group-head" data-i18n="settings.app"></h2>
          </div>
          <div class="settings-rows">
            <div id="install-group" class="list-group" hidden>
              <button id="install" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.install"></span><span class="chevron" aria-hidden="true">›</span></button>
            </div>
            <div class="list-group">
              <button id="show-onboarding" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.onboarding"></span><span class="chevron" aria-hidden="true">›</span></button>
              <button id="show-review" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.review"></span><span class="chevron" aria-hidden="true">›</span></button>
              <button id="show-whatsnew" class="settings-row" type="button" hidden><span class="settings-row-label" data-i18n="settings.whatsNew"></span><span class="chevron" aria-hidden="true">›</span></button>
            </div>
          <footer class="about">
            <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
            <button id="update" class="button accent" type="button" hidden><span data-i18n="settings.update"></span></button>
          </footer>
          </div>
        </section>
        <section class="settings-group">
          <div class="settings-label">
            <h2 class="list-group-head" data-i18n="settings.erase"></h2>
            <p class="settings-note" data-i18n="settings.eraseNote"></p>
          </div>
          <div class="settings-rows">
            <div class="list-group">
              <button id="reset" class="settings-row danger" type="button"><span class="settings-row-label" data-i18n="settings.reset"></span></button>
            </div>
          </div>
        </section>
      </section>
    </main>

    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <button class="nav-item" type="button" data-view="feed">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#feed"/></svg>
        <span data-i18n="nav.feed"></span>
      </button>
      <button class="nav-item" type="button" data-view="saved">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#bookmark"/></svg>
        <span data-i18n="nav.saved"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="whatsnew-sheet" class="sheet-layer" hidden>
      <div id="whatsnew-veil" class="sheet-veil"></div>
      <section id="whatsnew" class="sheet" role="dialog" aria-modal="true" aria-labelledby="whatsnew-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="whatsnew-title" class="sheet-title main" data-i18n="whatsNew.title"></h2><button id="whatsnew-close" class="button tonal" type="button" data-i18n="whatsNew.close"></button></header>
        <div id="whatsnew-body" class="sheet-body whatsnew-body"></div>
      </section>
    </div>

    <div id="review-sheet" class="sheet-layer review-layer" hidden>
      <div id="review-veil" class="sheet-veil"></div>
      <section id="review" class="sheet" role="dialog" aria-modal="true" aria-labelledby="review-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="review-title" class="sheet-title main" data-i18n="review.title"></h2><button id="review-close" class="button tonal" type="button" data-i18n="review.close"></button></header>
        <div id="review-body" class="sheet-body review-body"></div>
      </section>
    </div>

    <div id="card-sheet" class="sheet-layer" hidden>
      <div id="card-veil" class="sheet-veil"></div>
      <section id="card-menu" class="sheet" role="dialog" aria-modal="true" aria-labelledby="card-sheet-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="card-sheet-title" class="sheet-title main" data-i18n="card.sheetTitle"></h2><button id="card-close" class="button tonal" type="button" data-i18n="card.close"></button></header>
        <div class="sheet-body">
          <button class="entry" type="button" data-signal="hard"><span data-i18n="signal.hard"></span><small class="entry-note" data-i18n="signal.hardNote"></small></button>
          <button class="entry" type="button" data-signal="skip"><span data-i18n="signal.skip"></span><small class="entry-note" data-i18n="signal.skipNote"></small></button>
          <button class="entry" type="button" data-signal="report"><span data-i18n="signal.report"></span><small class="entry-note" data-i18n="signal.reportNote"></small></button>
        </div>
      </section>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" aria-labelledby="onboarding-title" hidden>
      <div class="onboarding-page">
        <img class="onboarding-logo" src="./icons/logo.png" alt="">
        <h2 id="onboarding-title" class="onboarding-title" data-i18n="onboarding.title"></h2>
        <p class="onboarding-text" data-i18n="onboarding.text"></p>
        <div id="onboarding-topics" class="topic-tiles" role="group" aria-labelledby="onboarding-title"></div>
        <div id="onboarding-sample" class="onboarding-sample"></div>
        <div class="onboarding-bar">
          <button id="onboarding-start" class="button primary" type="button"></button>
          <button id="onboarding-how" class="button quiet" type="button" data-i18n="onboarding.how"></button>
        </div>
      </div>
    </div>

    <section id="auth" class="account" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
      <div id="login" class="account-page">
        <img class="account-logo" src="./icons/logo.png" alt="">
        <h2 id="login-title" class="account-title" tabindex="-1" data-i18n="account.login.title"></h2>
        <p class="account-text" data-i18n="account.login.text"></p>
        <dl id="login-facts" class="account-facts" hidden>
          <div><dt id="fact-cards" class="account-fact-number"></dt><dd data-i18n="account.facts.cards"></dd></div>
          <div><dt id="fact-topics" class="account-fact-number"></dt><dd data-i18n="account.facts.topics"></dd></div>
          <div><dt id="fact-accounts" class="account-fact-number"></dt><dd data-i18n="account.facts.accounts"></dd></div>
        </dl>
        <div class="account-buttons">
          <button id="login-offline" class="button primary wide" type="button" data-i18n="account.offline"></button>
          <button id="login-google" class="button tonal wide" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#google"/></svg><span data-i18n="account.google"></span></button>
        </div>
        <p id="login-error" class="input-help danger" role="alert" hidden></p>
        <p class="account-fine" data-i18n="account.login.fine"></p>
        <div id="login-sample" class="account-sample" hidden></div>
      </div>
      <div id="waiting" class="account-page" hidden>
        <svg class="icon account-wait" aria-hidden="true"><use href="icons.svg#refresh"/></svg>
        <h2 id="waiting-title" class="account-title" tabindex="-1" data-i18n="account.waiting.title"></h2>
        <p class="account-text" data-i18n="account.waiting.text"></p>
        <button id="waiting-check" class="button tonal wide" type="button" data-i18n="account.waiting.check"></button>
        <button id="waiting-logout" class="button accent" type="button" data-i18n="account.logout"></button>
      </div>
    </section>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="importmap">
      {
        "imports": {
          "#app": "./src/app.js",
          "#ds/sheet": "./vendor/design-system/sheet.js",
          "#config": "./src/config.js",
          "#pocketbase": "./src/pocketbase.js",
          "#session": "./src/session.js",
          "#cards": "./src/cards.js",
          "#learning": "./src/learning.js",
          "#feed": "./src/feed.js",
          "#install": "./src/install.js",
          "#sections": "./src/sections.js",
          "#modules": "./src/modules.js",
          "#storage": "./src/storage.js",
          "#version": "./src/version.js",
          "#whatsnew": "./src/whatsnew.js",
          "#i18n": "./src/i18n.js",
          "#locales/en": "./src/locales/en.js",
          "#locales/es": "./src/locales/es.js",
          "#ui/context": "./src/ui/context.js",
          "#ui/controls": "./src/ui/controls.js",
          "#ui/install": "./src/ui/install.js",
          "#ui/nav": "./src/ui/nav.js",
          "#ui/settings": "./src/ui/settings.js",
          "#ui/card": "./src/ui/card.js",
          "#ui/feed": "./src/ui/feed.js",
          "#ui/saved": "./src/ui/saved.js",
          "#particles": "./src/particles.js",
          "#onboarding": "./src/onboarding.js",
          "#ui/dust": "./src/ui/dust.js",
          "#ui/onboarding": "./src/ui/onboarding.js",
          "#ui/whatsnew": "./src/ui/whatsnew.js",
          "#ui/update": "./src/ui/update.js",
          "#ui/account": "./src/ui/account.js"
        }
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
