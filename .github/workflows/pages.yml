# A release tag is a deploy: npm run release tags vX.Y.Z, and its push runs the tests, then
# builds and publishes the tagged commit to GitHub Pages. A failed test deploys nothing.
# A push to main deploys nothing (VER-9).
# Repository settings: Pages source "GitHub Actions"; the github-pages environment allows
# the tags v*.
name: Deploy to Pages

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Two jobs, so "Re-run failed jobs" re-runs only the deploy and finds one artifact.
  # In one job, deploy-pages can query the artifact a second after its upload and miss it,
  # and a re-run then uploads a second "github-pages" artifact that deploy-pages refuses.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
